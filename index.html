<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Is Under Maintenance</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0614;
      overflow: hidden;
    }

    .maintenance-wrapper {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1d0c2e 0%, #090510 100%);
    }

    .maintenance-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* খুব ছোট বা আল্ট্রা-ওয়াইড স্ক্রিনে লেখা যেন না কাটে */
    @media (max-aspect-ratio: 4/3) {
      .maintenance-wrapper img {
        object-fit: contain;
      }
    }
  </style>
</head>
<body>
  <main class="maintenance-wrapper" aria-label="Website Under Maintenance">
    <img src="maintenance.png" alt="Website Is Under Maintenance" />
  </main>
</body>
</html>
